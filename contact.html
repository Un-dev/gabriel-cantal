    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">GABRIEL<span>.</span></a>
        <button class="menu-toggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="clips.html">Clips</a></li>

        </ul>
    </nav>

    <section class="section" style="padding-top: 8rem;">
        <h2 class="section-title">Contact</h2>
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Envoyer</button>
        </form>
    </section>

    <footer class="footer">
        <div class="social-links">
            <a href="https://instagram.com/legabrielcantal" target="_blank" rel="noopener">Instagram</a>
        </div>
        <p>&copy; 2024 Gabriel Cantal. Tous droits réservés.</p>
    </footer>

    <script src="js/main.js?v=2"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Merci pour votre message ! Gabriel vous répondra rapidement.');
            this.reset();
        });
    </script>
</body>
